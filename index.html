<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-check-circle"></i> TaskFlow Pro</h1>
            <div class="header-buttons">
                <button id="addTaskBtn" class="btn-primary">
                    <i class="fas fa-plus"></i> New Task
                </button>
                <button id="filterBtn" class="btn-secondary">
                    <i class="fas fa-filter"></i> Filter
                </button>
            </div>
        </header>

        <!-- Task Form Modal -->
        <div id="taskModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Add New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Title</label>
                        <input type="text" id="taskTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskDueDate">Due Date</label>
                            <input type="date" id="taskDueDate" required>
                        </div>
                        <div class="form-group">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory">
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="shopping">Shopping</option>
                            <option value="health">Health</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Add Task</button>
                </form>
            </div>
        </div>

        <!-- Filter Modal -->
        <div id="filterModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Filter Tasks</h2>
                <div class="filter-options">
                    <div class="filter-group">
                        <label>Priority</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" value="low"> Low</label>
                            <label><input type="checkbox" value="medium"> Medium</label>
                            <label><input type="checkbox" value="high"> High</label>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Category</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" value="work"> Work</label>
                            <label><input type="checkbox" value="personal"> Personal</label>
                            <label><input type="checkbox" value="shopping"> Shopping</label>
                            <label><input type="checkbox" value="health"> Health</label>
                            <label><input type="checkbox" value="other"> Other</label>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Status</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" value="pending"> Pending</label>
                            <label><input type="checkbox" value="completed"> Completed</label>
                        </div>
                    </div>
                </div>
                <button id="applyFilter" class="btn-primary">Apply Filters</button>
            </div>
        </div>

        <!-- Task List Section -->
        <main>
            <div class="task-list" id="taskList">
                <!-- Tasks will be dynamically added here -->
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
